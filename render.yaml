services:
  - type: web
    name: contact-records
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    disk:
      name: contact-records-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: RECORDS_FILE
        value: /var/data/records.json
      - key: APP_PASSWORD
        sync: false
